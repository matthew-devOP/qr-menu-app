services:
  app:
    container_name: qr-menu-app-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3009:3009"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/qr-menu-app?schema=public
      - NEXTAUTH_URL=http://localhost:3009
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: qr-menu-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr-menu-app
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Use different port to avoid conflict with dev db if running
    restart: always

volumes:
  postgres_data_prod:
